<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Water Cooler</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; color: #eee; font-family: monospace; overflow: hidden; height: 100vh; }
#game { position: relative; width: 100vw; height: 100vh; }
#scene { position: absolute; inset: 0; background: #2a2a2a; image-rendering: pixelated; }
#dialogue { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 700px; background: rgba(0,0,0,0.85); padding: 16px; border: 2px solid #666; border-radius: 4px; font-size: 14px; line-height: 1.4; }
#responses { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
button { background: #333; color: #fff; border: 1px solid #666; padding: 8px 12px; font-family: monospace; font-size: 12px; cursor: pointer; }
button:hover { background: #444; }
#ui { position: absolute; top: 10px; left: 10px; font-size: 12px; }
#avatar-select { position: absolute; inset: 0; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
#avatars { display: flex; flex-wrap: wrap; gap: 8px; max-width: 600px; justify-content: center; }
.avatar { width: 48px; height: 48px; background: #555; cursor: pointer; border: 2px solid #333; }
.avatar.selected { border-color: #fff; }
#end-screen { position: absolute; inset: 0; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 20; }
</style>
</head>
<body>
<div id="game">
  <div id="scene"></div>
  <div id="ui">
    <div id="camera-label">WATER COOLER</div>
    <div id="score">Conformity: 50</div>
  </div>
  <div id="dialogue">Loading office...</div>
  <div id="responses"></div>
  <div id="avatar-select">
    <h2>SELECT AVATAR</h2>
    <div id="avatars"></div>
    <button onclick="startGame()" style="margin-top:20px;">START</button>
  </div>
  <div id="end-screen">
    <h1 id="end-title">YOU DID NOT SURVIVE</h1>
    <p id="end-text">The office continues without you.</p>
    <button onclick="location.reload()">REPLAY</button>
  </div>
</div>

<script type="module">
import { KokoroTTS } from "https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/+esm";

let tts = null;
let conformity = 50;
let exchanges = 0;
let selectedAvatar = 0;
let currentCamera = 0;

const cameras = ["WATER COOLER", "FAR BACK", "3 O'CLOCK", "10 O'CLOCK", "TOP DOWN", "OFFICE PAN"];
const avatars = Array.from({length:18}, (_,i) => ({ id: i, color: ["#8B4513","#2F4F4F","#A0522D","#CD853F","#8B7355","#556B2F","#4682B4","#5F9EA0","#708090","#2E8B57","#3CB371","#20B2AA","#DAA520","#B8860B","#BC8F8F","#F4A460","#DEB887","#D2691E"][i] }));

const ambient = [
  "Did you see the Bears game? Embarrassing.",
  "The coffee's weak again.",
  "Traffic was insane today.",
  "Who keeps taking my pens?",
  "The elevator's broken again.",
  "I left my badge at home.",
  "Rain's coming.",
  "My kid's team won. Barely.",
  "Is this the decaf or the regular?",
  "The vending machine ate my dollar."
];

const political = [
  "They tried to take over the country on January 6th.",
  "Trump is a monster.",
  "He's a Nazi.",
  "Disinformation czars are perfectly okay.",
  "We're never gonna be able to vote again.",
  "If you're not supporting our minorities, you're not American.",
  "You don't support the troops? Then you ain't American.",
  "Putin's puppet.",
  "He's a tyrant. A fascist. A threat to our democracy.",
  "They wrote about suspending the Constitution."
];

function buildAvatars() {
  const container = document.getElementById("avatars");
  avatars.forEach(a => {
    const div = document.createElement("div");
    div.className = "avatar";
    div.style.background = a.color;
    div.onclick = () => { selectedAvatar = a.id; document.querySelectorAll(".avatar").forEach(x => x.classList.remove("selected")); div.classList.add("selected"); };
    container.appendChild(div);
  });
}

async function initTTS() {
  try {
    tts = await KokoroTTS.from_pretrained("onnx-community/Kokoro-82M-v1.0-ONNX", { dtype: "q8", device: "webgpu" });
  } catch {
    try { tts = await KokoroTTS.from_pretrained("onnx-community/Kokoro-82M-v1.0-ONNX", { dtype: "q8", device: "wasm" }); } catch { tts = null; }
  }
}

async function speak(text) {
  if (!tts) return;
  try {
    const audio = await tts.generate(text, { voice: "af_heart" });
    const url = URL.createObjectURL(audio.toBlob());
    new Audio(url).play().catch(()=>{});
  } catch {}
}

function nextScene() {
  exchanges++;
  if (exchanges > 12) { endGame(); return; }
  currentCamera = Math.floor(Math.random() * cameras.length);
  document.getElementById("camera-label").textContent = cameras[currentCamera];
  document.getElementById("scene").style.background = currentCamera === 4 ? "#1a1a1a" : "#2a2a2a";

  const isPolitical = Math.random() > 0.4;
  const line = isPolitical ? political[Math.floor(Math.random()*political.length)] : ambient[Math.floor(Math.random()*ambient.length)];
  const full = ambient[Math.floor(Math.random()*ambient.length)] + " " + line;
  document.getElementById("dialogue").textContent = full;
  speak(full);

  const container = document.getElementById("responses");
  container.innerHTML = "";
  ["Smile","Frown","Agree","Disagree","Push back"].forEach(label => {
    const b = document.createElement("button");
    b.textContent = label;
    b.onclick = () => respond(label);
    container.appendChild(b);
  });
}

function respond(choice) {
  let delta = 0;
  if (choice === "Agree" || choice === "Smile") delta = 8;
  else if (choice === "Disagree" || choice === "Frown") delta = -6;
  else if (choice === "Push back") delta = -12;
  conformity = Math.max(0, Math.min(100, conformity + delta));
  document.getElementById("score").textContent = "Conformity: " + conformity;
  setTimeout(nextScene, 1200);
}

function endGame() {
  document.getElementById("end-screen").style.display = "flex";
  if (conformity < 30) {
    document.getElementById("end-title").textContent = "EXCOMMUNICATED";
    document.getElementById("end-text").textContent = "They walk past you. The top-down view holds. You are furniture.";
    document.getElementById("camera-label").textContent = "TOP DOWN";
  } else {
    document.getElementById("end-title").textContent = "YOU DID NOT SURVIVE";
    document.getElementById("end-text").textContent = "The sun sets. The sun rises. The cooler is still there.";
  }
}

function startGame() {
  document.getElementById("avatar-select").style.display = "none";
  nextScene();
}

buildAvatars();
initTTS();
</script>
</body>
</html>
